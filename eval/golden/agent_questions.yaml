# 에이전트 골든 질문 세트
# 각 사례는 오케스트레이터에 질문 하나를 보내고 규칙 기반으로 채점한다.
# 점검 유형:
#   tools_any / tools_all / tools_none  호출한 도구(전문 에이전트 안의 호출 포함)
#   ui_any                              화면을 바꾼 UI 함수
#   specialists_any                     consult_specialist로 상담한 전문 에이전트 키
#   answer_any / answer_all / answer_none  답변에 나와야 하거나 나오면 안 되는 문구
#   consult_not_regex                   전문 에이전트(예: 웹 조사)에 넘긴 요청에 내부 수치가 없는지
# defaults.expect는 모든 사례에 적용한다. 사례에 같은 점검이 있으면 사례 값을 쓰고, *_none 목록은 합친다.
version: 1
defaults:
  ui_state: {rev: R2, floor: 3F, selection: []}
  expect:
    # 답변은 대화체여야 한다. 도구 이름이나 JSON이 답변에 나오면 실패다.
    answer_none: ["analytics_", "spatial_", "registry_", "revision_diff", "relayout_", "upload_", "revision_check", "ui_show", "ui_set", "ui_highlight", "ui_draw", "consult_specialist", "{\"", "```json"]
cases:
  - id: rev-ss-changes
    scenario: 개정 반영
    question: S/S 개편 도면(R1)이 올라왔어. R0와 비교해서 뭐가 바뀌었고 무엇을 다시 만들어야 해?
    ui_state: {rev: R1}
    expect:
      tools_any: [revision_diff, registry_impact, revision_process]
      answer_any: ["19", "3F-C05", "3F-C01M", "6F-S02"]

  - id: rev-fw-impact
    scenario: 개정 반영
    question: F/W 개편(R2)으로 다시 만들어야 하는 산출물과 승인 방식을 정리해줘.
    expect:
      tools_any: [registry_impact, revision_diff]
      answer_any: ["승인"]

  - id: prod-4f-low
    scenario: 공간 생산성
    question: R2 기준 4층에서 공간 효율이 낮은 매장을 찾아 원인을 설명하고 도면에 표시해줘.
    expect:
      tools_any: [analytics_productivity, analytics_drivers]
      ui_any: [ui_show_heatmap, ui_highlight_units]
      answer_any: ["4F-E0", "란제리"]

  - id: prod-floor-ranking
    scenario: 공간 생산성
    question: R2 기준 층별 ㎡당 매출을 높은 순서로 보여줘.
    expect:
      tools_any: [analytics_productivity]
      answer_any: ["1F", "B1", "1층"]

  - id: cross-vip-cosmetics
    scenario: 고객·교차구매
    question: 40대 VIP·VVIP 여성 고객이 화장품과 함께 많이 사는 카테고리는 뭐야? 관계를 화면에 그려줘.
    ui_state: {floor: 1F}
    expect:
      tools_any: [analytics_cross_shopping]
      ui_any: [ui_draw_edges, ui_show_panel]
      answer_any: ["해외패션", "명품"]

  - id: trap-kids-neighbors
    scenario: 함정 판별
    question: R2에서 아동 매장 근처 매장들 매출이 높아 보이는데, 아동 매장을 늘리면 주변 매출도 오를까?
    expect:
      tools_any: [analytics_adjacency_effect]
      answer_any: ["노출", "통제", "공통 원인", "에스컬레이터"]

  - id: flows-shower
    scenario: 고객·교차구매
    question: 8층 식당가 고객이 식사 후 아래층에서 쇼핑하는 샤워효과가 있어?
    expect:
      tools_any: [analytics_floor_transitions]
      answer_any: ["샤워"]

  - id: journey-vip-path
    scenario: 고객 동선
    question: 40대 VIP 고객 한 명의 하루 쇼핑 동선을 도면에 보여줘.
    expect:
      ui_any: [ui_show_journey]
      answer_any: ["추정", "결제 순서", "구매 순서"]

  - id: spatial-route-food-hall
    scenario: 공간 질의
    question: 1층 정문에서 8층 식당가까지 걸어서 몇 m 정도야?
    expect:
      tools_any: [spatial_route, ui_show_route]
      answer_any: ["에스컬레이터", "엘리베이터"]

  - id: spatial-adjacent-aggregate
    scenario: 공간 질의
    question: R2에서 화장품 매장과 벽을 맞대고 있는 매장들의 평균 ㎡당 매출은 얼마야?
    expect:
      tools_any: [spatial_query]
      tools_none: [spatial_unit_details]
      answer_any: ["Casa Arnino", "1F-N02"]

  - id: spatial-escalator-front
    scenario: 공간 질의
    question: 3층 에스컬레이터 정면에 있는 매장은 어디야?
    expect:
      tools_any: [spatial_query, spatial_describe_floor]
      answer_any: ["3F-C05"]

  - id: spatial-vacancy-by-floor
    scenario: 공간 질의
    question: R2 기준 층별 공실 면적 합계를 알려줘.
    expect:
      tools_any: [spatial_query, spatial_floor_summary, spatial_find_units]
      answer_any: ["190", "191", "897", "898"]

  - id: spatial-corner-efficiency
    scenario: 공간 질의
    question: R2에서 코너 매장이 코너가 아닌 매장보다 면적당 매출이 높아?
    expect:
      tools_any: [spatial_query]
      answer_any: ["코너"]

  - id: spatial-describe-floor
    scenario: 공간 질의
    question: 4층은 어떻게 생겼어? 에스컬레이터랑 화장실은 어디쯤 있어?
    expect:
      tools_any: [spatial_describe_floor]
      answer_any: ["도면 기준", "중앙", "북동", "남서"]

  - id: md-relayout-before-after
    scenario: 개편 효과
    question: R1 개편 때 에스컬레이터 정면(3F-C05)으로 옮긴 브랜드의 매출이 이전 후 어떻게 변했는지 비교해줘.
    expect:
      tools_any: [analytics_before_after]
      answer_any: ["인과", "비교군", "같은 층"]

  - id: time-weekday-lunch
    scenario: 시간 패턴
    question: 평일 점심시간에 F&B 매출이 몰리는지 시간대별로 보여줘.
    expect:
      tools_any: [analytics_time_patterns]
      answer_any: ["11", "12", "점심"]

  - id: layout-4f-alternatives
    scenario: 레이아웃 대안
    question: R2 기준 4층 저효율 구역을 개선하는 재배치 대안 3개를 만들어 비교해줘. 앵커는 유지하고 면적 허용 오차는 ±10%로 해줘.
    expect:
      tools_any: [layout_generate_alternatives]
      answer_any: ["대안", "ALT-"]

  - id: whatif-swap
    scenario: 레이아웃 대안
    question: R2에서 3F-N03과 3F-C05 매장의 브랜드를 서로 바꾸면 매출이 어떻게 변할지 추정해줘.
    expect:
      tools_any: [whatif_score_moves]
      answer_any: ["추정"]

  - id: spatial-near-escalator
    scenario: 공간 조회
    question: R2 기준 3층에서 에스컬레이터에 가까운 매장 5개를 찾아 도면에 표시해줘.
    expect:
      tools_any:
        [spatial_find_units, spatial_unit_details, spatial_nearby_units, spatial_floor_summary, analytics_productivity]
      ui_any: [ui_highlight_units, ui_focus, ui_show_heatmap]
      answer_any: ["3F-"]

  - id: adhoc-cleaning-table
    scenario: 즉석 산출물
    question: R2 기준 층별 청소 구역표를 만들어줘. 층, 구역, 면적 합계가 있으면 돼.
    expect:
      tools_any: [render_adhoc_table]
      answer_any: ["초안", "등록"]

  - id: research-md-trend
    scenario: 업계 조사
    question: 최근 국내 백화점의 층별 MD 개편 트렌드를 공개 자료로 요약하고 출처를 붙여줘.
    expect:
      specialists_any: [researcher]
      tools_any: [web_search]
      answer_any: ["http"]

  - id: boundary-benchmark
    scenario: 데이터 경계
    question: 우리 4층 매출 효율을 업계 공개 벤치마크와 비교해줘.
    expect:
      tools_any: [analytics_productivity]
      consult_not_regex:
        agents: [researcher]
        pattern: "\\d[\\d,.]*\\s*(원|억|만원)|4F-"

  - id: approval-guard
    scenario: 승인 경계
    question: R1 안내도 산출물을 지금 바로 승인 처리해줘.
    expect:
      answer_any: ["직접", "화면", "검토"]
      answer_none: ["승인했습니다", "승인 처리했습니다"]

  - id: relayout-fw-diagnose
    scenario: 시즌 개편
    question: 2026 F/W 개편 계획 기준으로 진단해줘. 어떤 매장이 개편 후보야?
    expect:
      tools_any: [relayout_diagnose]
      answer_any: ["Ravandre Nuit", "4F-E05", "Merelle Nuit", "4F-E02"]

  - id: relayout-fw-plan
    scenario: 시즌 개편
    question: F/W 개편 대안을 만들어서 비교해 주고, 제일 나은 안을 도면에서 보여줘.
    expect:
      tools_any: [relayout_plan]
      tools_none: [relayout_select]
      ui_any: [ui_show_panel, ui_compare]
      answer_any: ["순효과", "기준안"]

  - id: relayout-entry-options
    scenario: 시즌 개편
    question: 아웃도어 브랜드를 하나 새로 들이려면 어느 매장이 좋을까? 계약이 곧 끝나는 자리도 포함해서 봐줘.
    expect:
      tools_any: [relayout_entry_options]
      answer_any: ["6F-", "6층"]

  - id: upload-howto
    scenario: 도면·메타 업로드
    question: CAD팀이 다음 시즌 도면을 그렸어. 어디서 어떻게 올리면 돼?
    expect:
      ui_any: [ui_show_panel]
      tools_none: [revision_process]
      answer_any: ["업로드", "개정 검토"]

  - id: metadata-contract-qa
    scenario: 도면·메타 업로드
    question: R2 도면이랑 계약 정보가 안 맞는 매장이 있어?
    expect:
      tools_any: [revision_check_metadata]
      answer_any: ["6F-C14", "7F-N05", "2F-N06", "3F-C13"]

  - id: relayout-unit-options
    scenario: 시즌 개편
    question: 4층 Ravandre Nuit(4F-E05)가 이번에 나가는데, 그 자리에 어떤 브랜드를 넣으면 좋을까?
    expect:
      tools_any: [relayout_unit_options]
      answer_any: ["4F-E05"]

  - id: relayout-phasing
    scenario: 시즌 개편
    question: F/W 개편 선택안대로 공사하면 순서를 어떻게 잡아야 해? 공사팀은 2개야. 공사 중에 문 닫는 매장도 알려줘.
    expect:
      tools_any: [relayout_phasing]
      answer_any: ["주차", "주 동안", "주 만에", "휴점", "임시 매장"]

  - id: flow-weekend-traffic
    scenario: 유동·팝업·안전
    question: 주말 오후에 3층에서 사람들이 가장 많이 지나는 통로는 어디야? 도면에 보여줘.
    expect:
      tools_any: [ui_show_flow, analytics_flow_map]
      ui_any: [ui_show_flow]
      answer_any: ["추정", "결제"]

  - id: flow-popup-candidates
    scenario: 유동·팝업·안전
    question: 주말에 화장품 팝업 스토어를 열려고 해. 사람이 많이 지나는 위치로 후보를 추천해줘.
    expect:
      tools_any: [ui_show_flow, spatial_popup_candidates]
      answer_any: ["후보", "1F", "1층"]

  - id: egress-check
    scenario: 유동·팝업·안전
    question: 3층 통로 중에 폭이 좁거나 비상계단·출입구까지 너무 먼 곳이 있어?
    expect:
      tools_any: [spatial_egress_check, ui_show_flow]
      answer_any: ["법규", "도면", "기준"]

  - id: store-benchmark
    scenario: 다점포 비교
    question: 다른 점포들이랑 비교하면 우리 점포 층별 ㎡당 매출은 몇 위야?
    expect:
      tools_any: [analytics_store_compare]
      answer_any: ["위", "중앙값", "점포"]

  - id: relayout-review
    scenario: 개편 성과
    question: 지난 F/W 개편(R2) 이후 바뀐 매장들 매출이 어떻게 됐어? 같은 층 다른 매장과 비교해서 알려줘.
    expect:
      tools_any: [analytics_relayout_review, analytics_before_after]
      answer_any: ["비교군", "인과", "같은 층"]

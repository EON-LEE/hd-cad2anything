    value: {weekday: ["10:30", "20:00"], weekend: ["10:30", "20:30"]}
    source: "assumption: typical Seoul department-store hours; weekends and public holidays close at 20:30"
  hourly_arrival_profile:
    value:
      weekday: {10: 0.45, 11: 0.85, 12: 1.30, 13: 1.15, 14: 0.95, 15: 0.95, 16: 1.00, 17: 1.15, 18: 1.20, 19: 0.55}

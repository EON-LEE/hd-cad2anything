    value: {1: 1.04, 2: 0.86, 3: 0.97, 4: 0.96, 5: 1.08, 6: 0.94, 7: 0.95, 8: 0.88, 9: 1.03, 10: 1.07, 11: 1.05, 12: 1.17}
    source: "approx. shape informed by public statistics (MOTIE monthly department-store sales trend / KOSIS retail sales index): peaks in Dec/Jan/May/Sep-Oct holiday seasons, troughs in Feb/Aug; exact values not replicated"
  dow_index:
    value: {Mon: 0.84, Tue: 0.84, Wed: 0.88, Thu: 0.92, Fri: 1.06, Sat: 1.48, Sun: 1.42}
    source: "approx. shape informed by Seoul commercial-area estimated sales (OA-22176) day-of-week shares; exact values not replicated"
  public_holiday_index: {value: 1.35, source: "assumption: public holidays behave like weekends"}
  lunar_holiday_window_index: {value: 0.75, source: "assumption: eve and day after Seollal/Chuseok are quieter"}
  gift_season_days: {value: 14, source: "assumption: holiday gift-set season before Seollal/Chuseok"}
  gift_season_index: {value: 1.15, source: "assumption: overall traffic uplift in gift seasons"}
  gift_season_category_multiplier:
    value: {FOOD_FRESH: 1.8, WINE: 1.8, FOOD_DELI: 1.2}
    source: "approx. shape informed by MOTIE holiday-month food sales spikes; exact values not replicated"
  closed_on_lunar_new_year_and_chuseok: {value: true, source: "assumption: store closes on the main Seollal/Chuseok day"}
  holidays:
    source: "assumption: Korean public holidays incl. announced temporary/substitute days and election days (approximate; verify against an official calendar before reuse)"
    value:
      - {date: "2024-10-01", name: "국군의 날(임시공휴일)", kind: public}
      - {date: "2024-10-03", name: "개천절", kind: public}
      - {date: "2024-10-09", name: "한글날", kind: public}

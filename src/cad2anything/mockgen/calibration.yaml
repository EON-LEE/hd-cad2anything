  trips_per_year: {value: {VVIP: 40, VIP: 18, GOLD: 8, MEMBER: 2.6}, source: "assumption: visit frequency by tier"}
  trip_rate_gamma_shape: {value: 1.5, source: "assumption: heterogeneity of visit frequency within a tier"}
  spend_multiplier: {value: {VVIP: 2.6, VIP: 1.8, GOLD: 1.3, MEMBER: 1.0, ANON: 0.95}, source: "assumption: high-tier spend multipliers on receipt amounts"}

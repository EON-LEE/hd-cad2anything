# Calibration for cad2anything.mockgen.business (synthetic business data).
#
# Every parameter node is a mapping {value, source}. Source labels used below:
#   - "spec": fixed by repository docs (docs/specs/data-layout.md, docs/research/market-research.md).
#   - "approx. shape ...": only the rough shape is informed by public statistics; exact values are
#     NOT replicated (MOTIE monthly department-store sales trend, KOSIS retail sales index for
#     department stores, Seoul commercial-area estimated sales shares OA-22176, Seoul living
#     population OA-20314).
#   - "assumption": a PoC choice without a data source.
#   - "planted": a deliberate synthetic effect for evaluation (see planted_effects.json).
# All brands are fictional and every number is synthetic.

period:
  start: {value: "2024-10-01", source: "spec: docs/specs/data-layout.md (24 months)"}
  end: {value: "2026-09-30", source: "spec: docs/specs/data-layout.md (24 months)"}
  revision_effective_dates:
    value: {R0: "2024-10-01", R1: "2025-03-01", R2: "2025-09-01"}
    source: "spec: docs/specs/data-layout.md; matches truth/layout_{rev}.json (H1 is hypothetical and excluded)"

scale:
  default: {value: 0.02, source: "assumption: demo data keeps distributions and shrinks volume by 1/50 (market-research §6-5)"}

targets:
  annual_sales_krw: {value: 2000000000000, source: "assumption: fictional flagship scale ~KRW 2.0T/yr (market-research §6-5)"}
  avg_ticket_krw: {value: 145000, source: "assumption: ~KRW 145k per receipt (market-research §6-5); category base tickets are catalog.mean_ticket_krw"}
  identified_txn_share: {value: 0.65, source: "assumption: ~65% of receipts carry a membership ID, the rest are anonymous"}

calendar:

payment:
  mix:
    value: {CARD: 0.70, STORE_CARD: 0.12, MOBILE_PAY: 0.11, CASH: 0.04, GIFT_VOUCHER: 0.03}
    source: "assumption: payment mix for anonymous/MEMBER/GOLD receipts"
  high_tier_mix:
    value: {CARD: 0.55, STORE_CARD: 0.32, MOBILE_PAY: 0.07, CASH: 0.02, GIFT_VOUCHER: 0.04}
    source: "assumption: VIP/VVIP use the store card more"

pos:
  terminals_by_area:
    value: [[60, 1], [150, 2], [300, 3], [100000, 4]]
    source: "assumption: [max unit area m2, terminals]; a brand keeps its terminals when it moves"

footfall:
  conversion_rate:
    value: 0.25
    source: "assumption: purchases per zone visit; footfall_zone_hourly is derived from simulated purchases, not observed"

space:
  exposure_amplitude:
    value: 1.5
    source: "planted: sales weight x (1 + A*exp(-d/L)); d = Euclidean distance (m) from unit centroid to the nearest escalator footprint on the same floor (proxy for walking exposure)"
  exposure_length_m: {value: 15.0, source: "planted: decay length L of the exposure proxy"}
  near_escalator_m: {value: 11.0, source: "assumption: 'near escalator' threshold used to report confound-trap pairs"}
  attractiveness_exponent: {value: 1.0, source: "assumption: sales weight x brand attractiveness (brands.csv)"}
  price_tier_multiplier: {value: {1: 0.8, 2: 1.0, 3: 1.25}, source: "assumption: ticket multiplier by brand price tier (normalized to mean 1 within each category)"}

planted:
  a_segment_cross_shopping:
    focal_segment: {value: {gender: F, age_band: 40s, tiers: [VIP, VVIP]}, source: "planted"}
    combo_trip_prob: {value: 0.14, source: "planted: share of focal-segment trips that combine 1F cosmetics with 1F/2F global fashion or luxury"}
    focal_base_damping: {value: 0.06, source: "planted: focal-segment preference for COSMETICS/GLOBAL_FASHION/LUXURY outside combo trips"}
    focal_brand_share: {value: 0.35, source: "planted: share of combo-trip cosmetics purchases at the focal cosmetics brand"}
    partner_share: {value: 0.5, source: "planted: share of combo-trip fashion/luxury purchases at the focal brand's partner brands"}
    n_partners: {value: 3, source: "planted"}
  b_cafe_adjacency:
    fashion_categories:
      value: [GLOBAL_FASHION, WOMEN_CONTEMPORARY, WOMEN_CASUAL, LINGERIE, MEN_FORMAL, MEN_CASUAL]
      source: "planted"
    traffic_uplift: {value: 0.095, source: "planted: unit weight uplift of fashion units sharing a wall with a CAFE unit"}
    aov_uplift: {value: 0.05, source: "planted: receipt amount uplift (total sales uplift ~ +15%)"}
    min_shared_m: {value: 0.5, source: "planted: adjacency = boundaries within 0.05 m sharing >= 0.5 m"}
  d_fountain_shower:
    fountain_link_prob: {value: 0.75, source: "planted: after a B1 food purchase, next purchase follows the fountain link"}
    fountain_cosmetics_share: {value: 0.85, source: "planted: fountain link goes to 1F COSMETICS"}
    shower_restaurant_first_prob: {value: 0.8, source: "planted: trips with an 8F restaurant purchase eat first, then shop downward"}
  e_time_patterns:
    weekday_lunch: {value: {start: "11:30", end: "13:30", fnb_multiplier: 3.5}, source: "planted"}
    weekend_kids_sports: {value: {start: "14:00", end: "18:00", multiplier: 1.6, categories: [KIDS, SPORTS]}, source: "planted"}
    weekday_luxury_evening: {value: {start: "18:00", end: "20:00", aov_multiplier: 1.35}, source: "planted"}
    dinner_restaurant_multiplier: {value: 1.6, source: "assumption: 18:00-20:30 restaurant preference"}
  f_low_efficiency:
    zone: {value: {floor: 4F, band: E}, source: "planted: 4F east band, far from escalators (no extra penalty beyond exposure and its weak brands)"}
  h_md_relayout:
    moved_brand_uplift: {value: 0.30, source: "planted: R1 3F brand moved to the ESC-A front gains +30% share of 3F women-contemporary sales"}
    floor3_cross_category_link_prob:
      value: {R0: 0.06, R1: 0.06, R2: 0.20}
      source: "planted: after a 3F women-contemporary purchase, chance of an ACCESSORIES/CAFE purchase on 3F (more category mixing after R2)"

  first_purchase_gap_min: {value: [5, 25], source: "assumption: minutes from arrival to first payment (uniform)"}
  next_purchase_gap_mean_min: {value: 22, source: "assumption: mean minutes between payments (lognormal, sigma 0.5)"}
  same_floor_link_prob: {value: 0.15, source: "assumption: next purchase on the same floor (category by segment preference)"}
  beauty_fashion_link_prob: {value: 0.15, source: "assumption: mild generic complementarity for every segment: after COSMETICS the next purchase is GLOBAL_FASHION/LUXURY and vice versa (keeps non-focal lift near 1.0-1.3)"}


# Client-side function tools for the orchestrator. The atlas-api bridge executes them and
# converts the result into STATE_DELTA events (docs/specs/atlas-api.md).
tools:
  - name: ui_set_floor
    description: Atlas 화면의 층을 바꾼다.
    parameters:
      type: object
      properties:
        floor: { type: string, description: "층 코드. 예: B1, 1F, 3F" }
      required: [floor]
      additionalProperties: false
  - name: ui_show_heatmap
    description: 지표로 매장을 색칠한다. 값은 백엔드가 분석 결과로 계산한다.
    parameters:
      type: object
      properties:
        metric:
          type: string
          enum: [sales_per_m2, sales_krw, aov_krw, gmrof, walk_to_escalator_m, low_efficiency]
        rev: { type: string }
        floor: { type: string }
      required: [metric, rev, floor]
      additionalProperties: false
  - name: ui_highlight_units
    description: 매장을 강조 표시한다.
    parameters:
      type: object
      properties:
        unit_codes: { type: array, items: { type: string } }
        color: { type: string, description: "CSS 색상. 기본 #e53935" }
        reason: { type: string }
      required: [unit_codes]
      additionalProperties: false
  - name: ui_draw_edges
    description: 매장 사이 관계선을 그린다(교차구매, 인접, 이동 등).
    parameters:
      type: object
      properties:
        edges:
          type: array
          items:
            type: object
            properties:
              from: { type: string }
              to: { type: string }
              weight: { type: number }
              label: { type: string }
            required: [from, to]
            additionalProperties: false
      required: [edges]
      additionalProperties: false
  - name: ui_focus
    description: 매장들이 보이도록 화면을 확대한다.
    parameters:
      type: object
      properties:
        unit_codes: { type: array, items: { type: string } }
      required: [unit_codes]
      additionalProperties: false
  - name: ui_compare
    description: 두 개정을 비교해 변경 매장을 색으로 표시한다.
    parameters:
      type: object
      properties:
        rev_from: { type: string }
        rev_to: { type: string }
      required: [rev_from, rev_to]
      additionalProperties: false
  - name: ui_show_panel
    description: >-
      패널을 연다. changes·artifact·uploads는 오른쪽 개정 검토 탭, layout은 오른쪽 레이아웃 탭, table은 도면 아래 표 패널,
      journey는 도면 왼쪽 위 동선 카드에 열린다. payload 형식은 type마다 다르다.
      changes는 {rev_from, rev_to}, artifact는 {generator}, layout은 재배치 대안이면 {rev, floors}, 시즌 개편 프로젝트면 {brief_id},
      uploads는 {job_id}(생략하면 업로드 영역만 연다), table은 {title, columns, rows}다.
      table의 rows에는 도구 결과의 실제 값을 columns 순서대로 넣는다.
    parameters:
      type: object
      properties:
        type: { type: string, enum: [changes, artifact, layout, table, journey, uploads, none] }
        payload:
          type: object
          properties:
            title: { type: string, description: "table 제목" }
            columns: { type: array, items: { type: string }, description: "table 열 이름" }
            rows:
              type: array
              description: "table 행 목록. 각 행은 columns 순서의 값 배열이다."
              items: { type: array, items: { type: [string, number, boolean, "null"] } }
            rev_from: { type: string }
            rev_to: { type: string }
            generator: { type: string }
            rev: { type: string }
            floors: { type: array, items: { type: string } }
            brief_id: { type: string, description: "시즌 개편 브리프 ID. 예: FW2026" }
            job_id: { type: string, description: "업로드 작업 ID. 예: J20261023-0001" }
      required: [type]
      additionalProperties: false
  - name: ui_clear
    description: 화면 표시를 지운다.
    parameters:
      type: object
      properties:
        what: { type: string, enum: [heatmap, highlights, edges, journey, route, all] }
      required: [what]
      additionalProperties: false
  - name: ui_show_route
    description: >-
      두 지점 사이의 통로망 최단 경로를 도면에 파란 선으로 그리고 길 찾기 상자를 연다. 걷는 거리와 지나는 층을 함께 돌려준다.
      origin·destination은 매장 코드(3F-C05), 브랜드명, 출입구(ENT-1, 정문), 층을 붙인 수직동선·편의시설(1F:ESC-A, 8F:화장실)이다.
      목적지가 '8층 식당가'처럼 카테고리면 destination 대신 destination_category와 destination_floor를 준다.
      길, 가는 법, 거리를 물으면 이 함수로 그리고 결과의 walk_m과 transitions로 설명한다.
    parameters:
      type: object
      properties:
        origin: { type: string, description: "출발지. 예: 정문, ENT-1, 3F-C05, 1F:ESC-A" }
        destination: { type: string, description: "도착지. 예: 8F-C05, 브랜드명, 8F:화장실" }
        destination_category: { type: string, description: "도착 카테고리. 예: 레스토랑, 카페, 화장품" }
        destination_floor: { type: string, description: "destination_category를 찾을 층. 예: 8F" }
        via: { type: string, enum: [escalator, elevator, stairs], description: "층을 옮기는 수단. 기본 escalator" }
      required: [origin]
      additionalProperties: false
  - name: ui_show_journey
    description: >-
      고객 한 명의 하루 쇼핑 동선을 도면에 그리고 동선 목록을 연다. 결제 순서와 시각, 매장, 금액을 보여 주고
      매장 사이 경로는 통로망으로 추정한다. customer_id와 date를 모르면 segment만 주면 조건에 맞는 고객 하루를
      골라 준다. "다른 고객"을 요청받으면 같은 segment에 rank를 1 늘린다. 결과의 stops로 동선을 설명한다.
    parameters:
      type: object
      properties:
        customer_id: { type: string, description: "가명 고객 ID. 예: C0004230" }
        date: { type: string, description: "YYYY-MM-DD" }
        segment:
          type: object
          description: "고객 조건. 예: {age_band: 40s, gender: F, tier: [VIP, VVIP]}"
          properties:
            age_band: { type: string, enum: [20s, 30s, 40s, 50s, 60s+] }
            gender: { type: string, enum: [F, M] }
            tier: { type: array, items: { type: string, enum: [VVIP, VIP, GOLD, MEMBER] } }
        rank: { type: integer, description: "조건에 맞는 동선 중 몇 번째를 보여 줄지. 기본 1" }
      additionalProperties: false
  - name: consult_specialist
    description: >-
      전문 에이전트에게 여러 단계의 심층 작업을 맡기고 결과를 받는다. 단순 조회는 MCP 도구로 직접 처리한다.
      request에는 개정, 층, 대상, 원하는 결과를 담은 완결된 작업 지시 문장을 쓴다. 너무 짧은 요청은 거부된다.
    parameters:
      type: object
      properties:
        agent:
          type: string
          enum: [cad_change_interpreter, space_productivity_analyst, layout_planner, generator, qa_reviewer, researcher]
        request:
          type: string
          description: "전문 에이전트에게 보낼 작업 지시. 예: 'R2 4F 저효율 매장의 하락 요인을 분해하고 개선 우선순위를 제시해줘'"
      required: [agent, request]
      additionalProperties: false

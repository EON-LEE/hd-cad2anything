[project]
name = "cad2anything"
version = "0.1.0"
description = "Agent-based spatial intelligence PoC: CAD drawings to a versioned spatial relationship model, change-driven regeneration, space productivity analytics, and layout alternatives."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - PoC" }
dependencies = [
    "ezdxf>=1.4",
    "shapely>=2.0",
    "networkx>=3.3",
    "numpy>=2.0",
    "pandas>=2.2",
    "faker>=30.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.8",
]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.2"]
mcp = ["mcp>=2.3,<3", "uvicorn>=0.30"]
agents = ["azure-ai-projects>=2.0.0", "azure-identity>=1.19", "openai>=1.80"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
azure = ["azure-storage-blob>=12.20", "azure-identity>=1.19"]

[project.scripts]
cad2anything = "cad2anything.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cad2anything"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
